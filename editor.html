<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TerraRiff Chart Editor</title>
  <meta name="description" content="TerraRiff: Chart Editor" />

  <style>
    /* ---------- VARIABLES (рок-стиль) ---------- */
    :root {
      --bg: #0b0b10;
      --panel: rgba(18, 18, 26, 0.9);
      --text: #f0f0fa;
      --text-muted: #b0b0c8;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #ff6b6b;
      --accent-secondary: #ffd93d;
      --shadow: rgba(0, 0, 0, 0.6);
      --container: 1300px;
      --radius: 20px;
      --radius-element: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- ЧАСТИЦЫ НА ФОНЕ ---------- */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
    }

    /* Весь контент поверх частиц */
    header, main, footer, .modal-overlay {
      position: relative;
      z-index: 2;
    }

    /* ---------- LAYOUT ---------- */
    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 14px 20px;
      width: 100%;
    }

    /* ---------- HEADER (как на главной) ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      background: rgba(11, 11, 16, 0.75);
      border-bottom: 1px solid var(--line);
    }

    .head {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      max-width: var(--container);
      margin: 0 auto;
      padding: 12px 20px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .brand:hover {
      opacity: 0.85;
    }
    
    .logo-text {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255, 107, 107, 0.15);
      padding: 4px 10px;
      border-radius: 40px;
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ffaaaa;
      letter-spacing: 0.3px;
    }
    
    .tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .headerActions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* ---------- CARDS (glassmorphism) ---------- */
    .card {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 40px var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    /* ---------- BUTTONS (рок-акценты) ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--radius-element);
      border: 1px solid var(--line);
      background: rgba(25, 20, 30, 0.7);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.15s ease;
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(8px);
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(60, 30, 40, 0.8);
      border-color: var(--accent);
      box-shadow: 0 8px 16px rgba(255, 107, 107, 0.15);
    }
    .btn.primary {
      border-color: rgba(255, 107, 107, 0.6);
      background: rgba(200, 60, 60, 0.2);
    }
    .btn.primary:hover {
      background: rgba(220, 70, 70, 0.3);
    }
    .btn:disabled,
    .btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
      transform: none;
      filter: none;
    }

    /* ---------- MAIN GRID ---------- */
    main {
      width: 100%;
      flex: 1;
      min-height: 0;
      max-width: var(--container);
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 20px;
      align-items: stretch;
    }

    /* ---------- TYPOGRAPHY ---------- */
    h2 {
      margin: 0 0 4px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: var(--accent);
    }

    label {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
      margin: 10px 0 6px;
      font-weight: 500;
    }

    /* ---------- INPUTS ---------- */
    input[type="file"],
    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      background: rgba(15, 15, 22, 0.7);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--radius-element);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      backdrop-filter: blur(4px);
    }
    input[type="range"] {
      width: 100%;
    }
    input[type="file"] {
      padding: 9px 10px;
    }
    input:focus,
    select:focus {
      outline: 2px solid rgba(255, 107, 107, 0.6);
      outline-offset: 2px;
    }

    .row {
      display: flex;
      gap: 10px;
    }
    .row > * {
      flex: 1;
    }

    .muted {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .kbd {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(25, 20, 30, 0.6);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      margin: 0 2px;
      backdrop-filter: blur(4px);
    }

    hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 10px 0;
    }

    /* ---------- TOOLBAR (верх канваса) ---------- */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .toolbar .left {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
    }
    .toolbar input[type="range"] {
      width: min(260px, 100%);
      min-width: 160px;
    }
    .audio-status {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--line);
    }
    .audio-status strong {
      color: var(--text);
      font-weight: 650;
    }

    /* ---------- STAGE (канвас) ---------- */
    .stageShell {
      flex: 1;
      min-height: 0;
      border-radius: 16px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: radial-gradient(900px 500px at 20% 0%, rgba(255, 107, 107, 0.08), transparent 60%),
                  radial-gradient(700px 500px at 90% 20%, rgba(255, 217, 61, 0.05), transparent 55%),
                  #07070b;
      display: flex;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5) inset;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
      outline: none;
    }
    #stage:focus {
      outline: 2px solid rgba(255, 107, 107, 0.7);
      outline-offset: -2px;
    }

    /* ---------- STATS ---------- */
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    #problemCount {
      color: #ff8a8a !important;
    }

    /* ---------- FOOTER ---------- */
    footer {
      width: 100%;
      border-top: 1px solid var(--line);
      background: rgba(11, 11, 16, 0.5);
      backdrop-filter: blur(10px);
    }
    .footerRow {
      max-width: var(--container);
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 12px;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }

    /* ---------- MODAL (рок-стиль) ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 25px 60px var(--shadow);
      width: 90%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
      backdrop-filter: blur(16px);
    }
    .modal h2 {
      margin: 0 0 20px 0;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      text-transform: none;
      letter-spacing: normal;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.15s;
    }
    .modal-close:hover {
      color: var(--accent);
    }
    .modal-section {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .modal-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .modal .btn {
      width: 100%;
      margin-top: 10px;
    }

    /* ---------- KEYBIND GRID (в модалке) ---------- */
    .keybind-grid {
      display: grid;
      grid-template-columns: 70px 1fr 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      margin: 14px 0;
    }
    .keybind-btn {
      padding: 10px !important;
    }

    /* ---------- HOTKEYS GRID ---------- */
    .hotkeys-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 950px) {
      .head {
        padding: 12px 16px;
      }
      main {
        grid-template-columns: 1fr;
        padding: 16px;
      }
      .footerRow {
        padding: 14px 16px;
      }
      .toolbar input[type="range"] {
        width: 180px;
      }
      .audio-status {
        max-width: 130px;
      }
    }
  </style>
</head>

<body>

<!-- КАНВАС ДЛЯ ЧАСТИЦ (на фоне) -->
<canvas id="particleCanvas"></canvas>

<header>
  <div class="head">
    <div class="brand" id="homeButton">
      <span class="logo-text">TerraRiff</span>
    </div>

    <div class="headerActions">
      <button id="settingsBtn" class="btn">⚙️ Settings</button>
      <button id="importBtn" class="btn">📂 Import SONG.json</button>
      <button id="exportBtn" class="btn primary" disabled>💾 Export SONG.json</button>
      <input id="importFile" type="file" accept=".json,application/json" style="display:none;">
    </div>
  </div>
</header>

<!-- модалка настроек -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="closeSettingsBtn">✕</button>
    
    <h2>Editor Settings</h2>

    <!-- формат экспорта -->
    <div class="modal-section">
      <label>Export Format</label>
      <select id="exportFormat">
        <option value="json">JSON file (song.json)</option>
        <option value="folder">Copy to TerraRiff/Songs/ folder</option>
      </select>
    </div>

    <!-- настройки клавиш -->
    <div class="modal-section">
      <label>Keybinds</label>
      <div class="keybind-grid">
        <span class="muted">Lanes:</span>
        <button class="keybind-btn btn" data-lane="0">Lane 1 (S)</button>
        <button class="keybind-btn btn" data-lane="1">Lane 2 (D)</button>
        <button class="keybind-btn btn" data-lane="2">Lane 3 (J)</button>
        <button class="keybind-btn btn" data-lane="3">Lane 4 (K)</button>
      </div>
    </div>

    <!-- визуальные настройки -->
    <div class="modal-section">
      <label>Note Speed</label>
      <div style="display:grid; grid-template-columns:1fr 60px; gap:10px; align-items:center;">
        <input type="range" id="noteSpeed" min="300" max="800" value="520" step="10">
        <span id="speedValue" class="muted">520px/s</span>
      </div>

      <label style="margin-top:16px;">Scroll Direction</label>
      <select id="scrollDir">
        <option value="down">Downscroll (notes fall down)</option>
        <option value="up">Upscroll (notes rise up)</option>
      </select>

      <label style="margin-top:16px;">Mouse Wheel</label>
      <select id="wheelDir">
        <option value="normal" selected>Normal (scroll forward = time forward)</option>
        <option value="inverted">Inverted (like DAW)</option>
      </select>

      <label style="margin-top:16px;">Hitline Position</label>
      <input type="range" id="hitlinePos" min="0.2" max="0.9" value="0.78" step="0.01">
    </div>

    <!-- оффсет аудио -->
    <div class="modal-section">
      <label>Audio Offset (ms)</label>
      <div style="display:grid; grid-template-columns:1fr 60px; gap:10px; align-items:center;">
        <input type="range" id="audioOffset" min="-200" max="200" value="0" step="5">
        <span id="offsetValue" class="muted">0ms</span>
      </div>
    </div>

    <!-- экшон настроек -->
    <div class="modal-section" style="display:flex; gap:8px;">
      <button id="resetSettingsBtn" class="btn">↺ Reset</button>
      <button id="exportSettingsBtn" class="btn">⬇ Export</button>
      <button id="importSettingsBtn" class="btn">⬆ Import</button>
    </div>
  </div>
</div>

<main>
  <section class="card">
    <h2>🎵 Song Settings</h2>

    <label>Track (MP3, OGG, FLAC, WAV, M4A, AAC, WMA)</label>
    <input id="audioFile" type="file" accept=".mp3,.ogg,.flac,.wav,.m4a,.aac,.wma,audio/*">

    <div class="row">
      <div>
        <label>Title</label>
        <input id="title" type="text" placeholder="Song title...">
      </div>
      <div>
        <label>Artist</label>
        <input id="artist" type="text" placeholder="Artist...">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Difficulty (1-10)</label>
        <input id="difficulty" type="number" step="1" min="1" max="10" value="3">
      </div>
      <div>
        <label>Lead-in (sec)</label>
        <input id="leadIn" type="number" step="0.01" min="0" value="1.00">
      </div>
    </div>

    <div class="row">
      <div>
        <label>BPM (for snap)</label>
        <input id="bpm" type="number" step="0.01" min="1" placeholder="e.g. 120">
      </div>
      <div>
        <label>Snap</label>
        <select id="snap">
          <option value="off">Off</option>
          <option value="1/4">1/4</option>
          <option value="1/8">1/8</option>
          <option value="1/16">1/16</option>
        </select>
      </div>
    </div>

    <label>Play Speed</label>
    <select id="playSpeed">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1.0x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2.0x</option>
    </select>

    <div class="row" style="margin-top:12px;">
      <button id="playBtn" class="btn" disabled>▶ Play / Pause</button>
      <button id="stopBtn" class="btn" disabled>⏹ Stop</button>
    </div>

    <hr>

    <h2>📊 Chart</h2>
    <div class="stats-row">
      <span class="muted" id="chartStats">Notes: 0 • Sustains: 0</span>
      <span class="muted" id="problemCount">⚠ 0 issues</span>
    </div>

    <div class="row">
      <button id="clearBtn" class="btn" disabled>🗑 Clear notes</button>
      <button id="quantizeBtn" class="btn" disabled>🎯 Quantize</button>
    </div>

    <hr>
    <h2>⌨️ Hotkeys</h2>
    <div class="hotkeys-grid">
      <div><span class="kbd" id="hotkeyLane0">S</span><span class="kbd" id="hotkeyLane1">D</span><span class="kbd" id="hotkeyLane2">J</span><span class="kbd" id="hotkeyLane3">K</span> + <span class="kbd">LMB</span> place</div>
      <div><span class="kbd">RMB</span> delete note</div>
      <div><span class="kbd">Space</span> play/pause</div>
      <div><span class="kbd">Ctrl+Z</span> undo</div>
      <div><span class="kbd">Ctrl+Y</span> redo</div>
      <div><span class="kbd">← →</span> / <span class="kbd">Wheel</span> scrub</div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <div class="left">
        <span class="muted">Scrub</span>
        <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" disabled>
        <span id="timeLabel" class="muted">0.000s</span>
        <span class="audio-status" id="audioStatus">🎵 not loaded</span>
      </div>
      <div class="right"></div>
    </div>

    <div class="stageShell">
      <canvas id="stage"></canvas>
    </div>
  </section>
</main>

<footer>
  <div class="footerRow">
    <div>🎸 TerraRiff, made with love by <a href="#">Wurper</a></div>
    <div>Editor version 0.7</div>
  </div>
</footer>

<script>
  // ========== СИСТЕМА ЧАСТИЦ (АУДИО-РЕАКТИВНАЯ) ==========
  (function() {
    const particleCanvas = document.getElementById('particleCanvas');
    const pCtx = particleCanvas.getContext('2d');
    
    let particles = [];
    const PARTICLE_COUNT = 80;
    
    // Аудио-анализатор
    let audioAnalyser = null;
    let audioDataArray = null;
    let audioSource = null;
    let analyserNode = null;
    
    // Глобальные переменные для BPM и энергии
    let currentBPM = 120;
    let audioEnergy = 0.5;
    let isAudioPlaying = false;
    
    // Размеры
    let width = window.innerWidth;
    let height = window.innerHeight;
    
    function resizeParticleCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      particleCanvas.width = width;
      particleCanvas.height = height;
    }
    window.addEventListener('resize', resizeParticleCanvas);
    resizeParticleCanvas();
    
    // Класс частицы
    class Particle {
      constructor() {
        this.reset();
      }
      
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.z = Math.random() * 500 + 100; // "глубина"
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.vz = (Math.random() * 2 + 1) * (1 + (currentBPM - 60) / 120); // скорость зависит от BPM
        this.size = Math.random() * 3 + 1;
        this.color = `hsla(${Math.random() * 30 + 340}, 80%, 60%, ${Math.random() * 0.3 + 0.2})`;
      }
      
      update(energy, bpm) {
        // Движение к зрителю (Z уменьшается)
        const speedMultiplier = 0.5 + (bpm / 120) * 0.8 + energy * 0.5;
        this.z -= this.vz * speedMultiplier;
        
        // Небольшое боковое смещение от "энергии"
        this.x += this.vx + (Math.random() - 0.5) * energy * 2;
        this.y += this.vy + (Math.random() - 0.5) * energy * 2;
        
        // Пульсация размера от энергии
        this.pulseSize = this.size * (1 + energy * 1.5);
        
        // Если частица "пролетела мимо камеры" или ушла за экран
        if (this.z <= 0 || this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
          this.reset();
          this.z = 500 + Math.random() * 300;
          // Начальная позиция — случайная по краям
          if (Math.random() > 0.5) {
            this.x = Math.random() * width;
            this.y = Math.random() > 0.5 ? -50 : height + 50;
          } else {
            this.x = Math.random() > 0.5 ? -50 : width + 50;
            this.y = Math.random() * height;
          }
        }
      }
      
      draw() {
        // Перспектива: чем ближе (меньше Z), тем больше и ярче
        const perspective = 400 / (this.z + 200);
        const screenX = this.x + (width / 2 - this.x) * (1 - perspective * 0.5);
        const screenY = this.y + (height / 2 - this.y) * (1 - perspective * 0.5);
        const screenSize = this.pulseSize * perspective * 1.5;
        const opacity = Math.min(perspective * 0.6, 0.6) * (0.5 + audioEnergy * 0.5);
        
        pCtx.beginPath();
        pCtx.arc(screenX, screenY, screenSize, 0, Math.PI * 2);
        
        // Градиент для частицы
        const gradient = pCtx.createRadialGradient(screenX, screenY, 0, screenX, screenY, screenSize);
        gradient.addColorStop(0, `hsla(${340 + audioEnergy * 20}, 80%, 70%, ${opacity})`);
        gradient.addColorStop(1, `hsla(${0 + audioEnergy * 30}, 80%, 50%, ${opacity * 0.3})`);
        
        pCtx.fillStyle = gradient;
        pCtx.fill();
        
        // Лёгкое свечение
        pCtx.shadowColor = `hsla(${0}, 80%, 60%, ${opacity * 0.5})`;
        pCtx.shadowBlur = screenSize * 3;
        pCtx.fill();
        pCtx.shadowBlur = 0;
      }
    }
    
    // Создаём частицы
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle());
    }
    
    // Анимация частиц
    function animateParticles() {
      pCtx.clearRect(0, 0, width, height);
      
      // Обновляем BPM из инпута
      const bpmInput = document.getElementById('bpm');
      if (bpmInput && bpmInput.value) {
        currentBPM = parseFloat(bpmInput.value) || 120;
      }
      
      // Получаем энергию из аудио если играет
      if (analyserNode && audioDataArray && isAudioPlaying) {
        analyserNode.getByteFrequencyData(audioDataArray);
        let sum = 0;
        for (let i = 0; i < audioDataArray.length; i++) {
          sum += audioDataArray[i];
        }
        audioEnergy = (sum / audioDataArray.length) / 255;
      } else {
        // Медленно затухаем
        audioEnergy *= 0.98;
      }
      
      // Сортируем по Z для правильного наложения
      particles.sort((a, b) => b.z - a.z);
      
      // Обновляем и рисуем
      particles.forEach(p => {
        p.update(audioEnergy, currentBPM);
        p.draw();
      });
      
      requestAnimationFrame(animateParticles);
    }
    
    animateParticles();
    
    // Экспортируем функции для подключения к аудио
    window.particleSystem = {
      connectAudio: function(audioCtx, source) {
        if (!audioCtx) return;
        
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 256;
        const bufferLength = analyserNode.frequencyBinCount;
        audioDataArray = new Uint8Array(bufferLength);
        
        if (source) {
          source.connect(analyserNode);
          analyserNode.connect(audioCtx.destination);
          audioSource = source;
        }
      },
      
      setPlaying: function(playing) {
        isAudioPlaying = playing;
        if (!playing) audioEnergy = 0.3;
      },
      
      updateBPM: function(bpm) {
        currentBPM = bpm || 120;
      }
    };
  })();

  // ========== ОРИГИНАЛЬНЫЙ КОД РЕДАКТОРА (с минимальными правками для частиц) ==========
  (() => {

  const audioFile = document.getElementById("audioFile");

  let audioCtx = null;

  function ensureAudioCtx(){

  function getTrackTime(){
    if (!audioCtx) return 0;

  }

  function getPlaySpeed(){
    return parseFloat(playSpeed.value) || 1;
  }

  function setTrackTime(t){
    const dur = getDuration();
    const clamped = Math.max(0, Math.min(t, dur));
    pausedAt = clamped;
    if (isPlaying){
      stopPlayback(true);
      startPlayback();

  function getSnapStep(){
    const mode = snapSel.value;
    if (mode === "off") return 0;
    const bpm = parseFloat(bpmInput.value);
    if (!isFinite(bpm) || bpm <= 0) return 0;
    const beat = 60 / bpm;
    if (mode === "1/4") return beat;
    if (mode === "1/8") return beat / 2;
    if (mode === "1/16") return beat / 4;
    return 0;
  }

  function snapTime(t){
    const step = getSnapStep();
    if (step <= 0) return t;
    return Math.round(t / step) * step;
  }

  function round3(x){ return Math.round(x * 1000) / 1000; }

  function pickLaneAndTime(mx, my){
    const rect = canvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    const fieldX = PAD;
    const fieldY = PAD;
    const fieldW = w - PAD * 2;
    const fieldH = h - PAD * 2;
    const laneW = fieldW / LANES;
    const hitY = fieldY + fieldH * HITLINE_Y_FRAC;
    const lane = Math.floor((mx - fieldX) / laneW);
    if (lane < 0 || lane >= LANES) return null;
    const t = getTrackTime();
    const speed = SCROLL_SPEED_PX_PER_SEC;
    const timeGuess = t + (hitY - my) / speed * SCROLL_DIRECTION;
    return { lane, time: timeGuess, fieldX, fieldY, fieldW, fieldH, laneW, hitY };
  }

  function pushUndo(){
    undoStack.push(JSON.stringify(notes));
    if (undoStack.length > 200) undoStack.shift();

  function undo(){
    if (undoStack.length === 0) return;
    redoStack.push(JSON.stringify(notes));

  }

  function redo(){
    if (redoStack.length === 0) return;

  }

  function enableControls(ready){

    stopBtn.disabled = !ready;

  async function loadAudio(file){
    ensureAudioCtx();

    pausedAt = 0;
    isPlaying = false;

    audioStatus.innerHTML = `<strong>${file.name}</strong> (${audioBuffer.duration.toFixed(2)}s)`;
    enableControls(true);
    scrub.max = audioBuffer.duration.toString();
    scrub.value = "0";

    if (!titleInput.value.trim()){
      titleInput.value = file.name.replace(/\.[^.]+$/, "");
    }
    updateStatsUI();
  }

  function startPlayback(){
    if (!audioCtx || !audioBuffer) return;
    if (isPlaying) return;
    
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.playbackRate.value = getPlaySpeed();
    
    // Подключаем к анализатору для частиц
    if (window.particleSystem) {
      window.particleSystem.connectAudio(audioCtx, sourceNode);
    } else {
      sourceNode.connect(audioCtx.destination);
    }
    
    startedAt = audioCtx.currentTime;
    sourceNode.start(0, pausedAt);
    isPlaying = true;
    
    if (window.particleSystem) {
      window.particleSystem.setPlaying(true);
    }
    
    sourceNode.onended = () => {
      if (!isPlaying) return;
      stopPlayback(false);
      setTrackTime(getDuration());
    };
  }

  function stopPlayback(keepTime){
    if (!audioCtx) return;
    if (sourceNode){
      try { sourceNode.onended = null; sourceNode.stop(); } catch {}
      try { sourceNode.disconnect(); } catch {}
      sourceNode = null;
    }
    if (isPlaying){
      const t = getTrackTime();
      isPlaying = false;
      if (!keepTime) pausedAt = t;
      
      if (window.particleSystem) {
        window.particleSystem.setPlaying(false);
      }
    }
  }

  function togglePlay(){
    if (!audioBuffer) return;
    ensureAudioCtx();
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (isPlaying) stopPlayback(false);
    else startPlayback();
  }

  function sortNotes(){
    notes.sort((a, b) => (a.time === b.time ? a.lane - b.lane : a.time - b.time));
    updateStatsUI();
  }

  function addTap(lane, t){
    pushUndo();
    notes.push({ time: round3(snapTime(t)), lane, duration: 0 });
    sortNotes();
  }

  function addHold(lane, tStart, tEnd){
    const a = snapTime(Math.min(tStart, tEnd));
    const b = snapTime(Math.max(tStart, tEnd));
    const dur = Math.max(0, b - a);
    pushUndo();
    notes.push({ time: round3(a), lane, duration: round3(dur) });
    sortNotes();
  }

  function deleteNearestNoteAt(lane, t, radiusSec){
    let bestI = -1;
    let bestAbs = Infinity;
    for (let i = 0; i < notes.length; i++){
      const n = notes[i];
      if (n.lane !== lane) continue;
      const abs = Math.abs(n.time - t);
      if (abs <= radiusSec && abs < bestAbs){
        bestAbs = abs;
        bestI = i;
      }
    }
    if (bestI === -1) return false;
    pushUndo();
    notes.splice(bestI, 1);
    updateStatsUI();
    return true;
  }

  function slugify(s){
    return (s || "").toLowerCase().trim().replace(/['"]/g, "").replace(/[^a-z0-9а-яё]+/gi, "_").replace(/^_+|_+$/g, "").slice(0, 48) || "song";
  }

  function getAudioFileName(){
    const f = audioFile.files && audioFile.files[0];
    return f ? f.name : "";
  }

  function findProblemNotes(){
    const problems = [];
    const TOLERANCE = 0.010;
    const byLane = [[], [], [], []];
    notes.forEach((n, idx) => { if (n.lane >= 0 && n.lane < 4) byLane[n.lane].push({ ...n, originalIndex: idx }); });
    byLane.forEach((laneNotes, lane) => {
      laneNotes.sort((a, b) => a.time - b.time);
      for (let i = 0; i < laneNotes.length; i++) {
        const current = laneNotes[i];
        if (i < laneNotes.length - 1) {
          const next = laneNotes[i + 1];
          const currentEnd = current.time + (current.duration || 0);
          if (currentEnd > next.time + TOLERANCE) {
            problems.push({ note1: current, note2: next, lane, type: 'overlap', message: 'Overlapping notes' });
          }
        }
        for (let j = i + 1; j < laneNotes.length; j++) {
          const other = laneNotes[j];
          const timeDiff = Math.abs(other.time - current.time);
          if (timeDiff < TOLERANCE) {
            problems.push({ note1: current, note2: other, lane, type: 'duplicate', message: 'Duplicate notes' });
          } else break;
        }
      }
    });
    const uniqueProblems = [];
    const seen = new Set();
    problems.forEach(p => {
      const id1 = `${p.note1.originalIndex}-${p.note2.originalIndex}`;
      const id2 = `${p.note2.originalIndex}-${p.note1.originalIndex}`;
      if (!seen.has(id1) && !seen.has(id2)) { seen.add(id1); uniqueProblems.push(p); }
    });
    problemCount.textContent = `⚠ ${uniqueProblems.length} issues`;
    return uniqueProblems;
  }

  function generateSongJson(){

  function importSongJsonText(text){
    let data;
    try { data = JSON.parse(text); }
    catch { return alert("JSON parse error"); }
    if (!data) return alert("Bad JSON");
    let meta = null;
    let noteArr = null;
    if (data.chart && Array.isArray(data.chart.notes)){ meta = data.meta || null; noteArr = data.chart.notes; }
    else if (Array.isArray(data.notes)){ noteArr = data.notes; }
    else { return alert("Bad JSON: expected { meta, chart:{notes:[...] } } or { notes:[...] }"); }
    if (meta){
      if (meta.title != null) titleInput.value = String(meta.title);
      if (meta.artist != null) artistInput.value = String(meta.artist);
      if (meta.bpm != null) bpmInput.value = String(meta.bpm);
      if (meta.difficulty != null) difficultyInput.value = String(meta.difficulty);
      if (meta.leadIn != null) leadInInput.value = String(meta.leadIn);
    }
    const arr = [];
    for (const n of noteArr){
      if (!n) continue;
      const time = Number(n.time);
      const lane = Number(n.lane);
      const duration = Number(n.duration || 0);
      if (!isFinite(time) || !isFinite(lane)) continue;
      if (lane < 0 || lane >= LANES) continue;
      arr.push({ time: round3(time), lane, duration: round3(Math.max(0, duration)) });
    }
    pushUndo();
    notes = arr;
    sortNotes();
  }

  function updateScrubUI(){
    if (!audioBuffer){ scrub.value = "0"; timeLabel.textContent = "0.000s"; return; }
    const t = getTrackTime();
    scrub.value = String(t);
    timeLabel.textContent = `${t.toFixed(3)}s`;
  }

  function updateStatsUI(){
    const sustains = notes.filter(n => n.duration > 0).length;
    chartStats.textContent = `Notes: ${notes.length} • Sustains: ${sustains}`;
    findProblemNotes();
    
    // Обновляем BPM для частиц
    const bpmVal = parseFloat(bpmInput.value);
    if (window.particleSystem && isFinite(bpmVal) && bpmVal > 0) {
      window.particleSystem.updateBPM(bpmVal);
    }
  }

  function drawSnapGrid(fieldX, fieldY, fieldW, fieldH, hitY, t){
    const step = getSnapStep();
    if (step <= 0) return;
    const speed = SCROLL_SPEED_PX_PER_SEC * SCROLL_DIRECTION;
    const tTop = t + (hitY - fieldY) / speed;
    const tBot = t + (hitY - (fieldY + fieldH)) / speed;
    const tMin = Math.min(tTop, tBot) - step * 2;
    const tMax = Math.max(tTop, tBot) + step * 2;
    let k = Math.floor(tMin / step);
    let guard = 0;
    ctx.save();
    ctx.beginPath();
    ctx.rect(fieldX, fieldY, fieldW, fieldH);
    ctx.clip();
    while (k * step <= tMax && guard++ < 10000){
      const tt = k * step;
      const y = hitY - (tt - t) * speed;
      const beat = 60 / (parseFloat(bpmInput.value) || 120);
      const isBeat = beat > 0 ? (Math.abs((tt / beat) - Math.round(tt / beat)) < 1e-6) : false;
      ctx.strokeStyle = isBeat ? "rgba(255,107,107,0.12)" : "rgba(255,255,255,0.05)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(fieldX + 1, y);
      ctx.lineTo(fieldX + fieldW - 1, y);
      ctx.stroke();
      k++;
    }
    ctx.restore();
  }

  function draw(){
    const rect = canvas.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    ctx.clearRect(0, 0, w, h);
    const fieldX = PAD;
    const fieldY = PAD;
    const fieldW = w - PAD * 2;
    const fieldH = h - PAD * 2;
    ctx.fillStyle = "#0b0b12";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(20,20,30,0.92)";
    roundRect(ctx, fieldX, fieldY, fieldW, fieldH, 10);
    ctx.fill();
    const laneW = fieldW / LANES;
    const hitY = fieldY + fieldH * HITLINE_Y_FRAC;
    for (let i = 0; i < LANES; i++){
      ctx.fillStyle = "rgba(30,30,45,0.75)";
      ctx.fillRect(fieldX + i * laneW + 1, fieldY + 1, laneW - 2, fieldH - 2);
    }
    const t = getTrackTime();
    const speed = SCROLL_SPEED_PX_PER_SEC * SCROLL_DIRECTION;
    const noteSize = NOTE_SIZE_PX;
    drawSnapGrid(fieldX, fieldY, fieldW, fieldH, hitY, t);
    for (let i = 0; i < LANES; i++){
      const cx = fieldX + i * laneW + laneW / 2;
      const down = keyDown[i] === true;
      const y = hitY + (down ? 1 : 0);
      const ringSize = Math.min(laneW - 8, noteSize + 12);
      drawRing(cx, y, ringSize / 2, down ? "#ffb8b8" : "rgba(255,255,255,0.9)", 3);
    }
    if (mousePlace.active && mousePlace.lane >= 0){
      const lane = mousePlace.lane | 0;
      const cx = fieldX + lane * laneW + laneW / 2;
      const a = snapTime(Math.min(mousePlace.t0, mousePlace.t1));
      const b = snapTime(Math.max(mousePlace.t0, mousePlace.t1));
      const headY = hitY - (a - t) * speed;
      const tailY = hitY - (b - t) * speed;
      const top = Math.min(headY, tailY);
      const bot = Math.max(headY, tailY);
      const bodyW = Math.max(6, noteSize / 3);
      const c = LANE_COLORS[lane];
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.35)`;
      ctx.fillRect(cx - bodyW / 2, top, bodyW, Math.max(1, bot - top));
      drawFilledCircle(cx, headY, noteSize / 2, `rgba(${c.r},${c.g},${c.b},0.55)`);
      drawRing(cx, headY, (noteSize / 2) + 3, "rgba(255,255,255,0.45)", 3);
    }
    for (const n of notes){
      if (n.duration <= 0) continue;
      const lane = n.lane | 0;
      const cx = fieldX + lane * laneW + laneW / 2;
      const headY = hitY - (n.time - t) * speed;
      const tailY = hitY - ((n.time + n.duration) - t) * speed;
      const top = Math.min(headY, tailY);
      const bot = Math.max(headY, tailY);
      if (bot < fieldY - 140 || top > fieldY + fieldH + 140) continue;
      const bodyW = Math.max(6, noteSize / 3);
      const c = LANE_COLORS[lane];
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.75)`;
      ctx.fillRect(cx - bodyW / 2, top, bodyW, Math.max(1, bot - top));
    }
    for (const n of notes){
      const lane = n.lane | 0;
      const cx = fieldX + lane * laneW + laneW / 2;
      const y = hitY - (n.time - t) * speed;
      if (y < fieldY - 140 || y > fieldY + fieldH + 140) continue;
      const c = LANE_COLORS[lane];
      drawFilledCircle(cx, y, noteSize / 2, `rgb(${c.r},${c.g},${c.b})`);
      drawRing(cx, y, (noteSize / 2) + 3, "rgba(255,255,255,0.92)", 3);
    }
    if (editorActive && notes.length > 0) {
      const problems = findProblemNotes();
      problems.forEach(p => {
        const lane = p.note1.lane;
        const cx = fieldX + lane * laneW + laneW / 2;
        const y1 = hitY - (p.note1.time - t) * speed;
        const y2 = hitY - (p.note2.time - t) * speed;
        ctx.fillStyle = "#ff5a5a";
        ctx.font = "bold 20px system-ui";
        ctx.fillText("⚠", cx - 10, (y1 + y2) / 2 - 10);
      });
    }
    ctx.fillStyle = "rgba(220,220,235,0.75)";
    ctx.font = "12px 'Inter', system-ui, sans-serif";
    const keyNames = editorSettings.keybinds.map(code => {
      if (code === 'KeyS') return 'S';
      if (code === 'KeyD') return 'D';
      if (code === 'KeyJ') return 'J';
      if (code === 'KeyK') return 'K';
      return code.replace('Key', '').replace('Digit', '');
    });
    for (let i = 0; i < LANES; i++) {
      ctx.fillText(keyNames[i], fieldX + laneW * i + 12, hitY + 24);
    }
    ctx.strokeStyle = "rgba(255,107,107,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(fieldX, hitY);
    ctx.lineTo(fieldX + fieldW, hitY);
    ctx.stroke();
    updateScrubUI();
    requestAnimationFrame(draw);
  }

  function drawFilledCircle(x, y, r, color){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
  function drawRing(x, y, r, color, thickness){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.strokeStyle = color; ctx.lineWidth = thickness; ctx.stroke(); }
  function roundRect(ctx2, x, y, w, h, r){ ctx2.beginPath(); ctx2.moveTo(x + r, y); ctx2.arcTo(x + w, y, x + w, y + h, r); ctx2.arcTo(x + w, y + h, x, y + h, r); ctx2.arcTo(x, y + h, x, y, r); ctx2.arcTo(x, y, x + w, y, r); ctx2.closePath(); }

  function loadSettings(){
    try {
      const saved = localStorage.getItem('terrariff_editor_settings');
      if (saved) { const parsed = JSON.parse(saved); editorSettings = { ...editorSettings, ...parsed }; updateSettingsUI(); }
    } catch (e) { console.warn('Failed to load settings:', e); }
  }

  function saveSettings(){
    try { localStorage.setItem('terrariff_editor_settings', JSON.stringify(editorSettings)); applySettings(); }
    catch (e) { console.warn('Failed to save settings:', e); }
  }

  function updateSettingsUI(){
    document.querySelectorAll('.keybind-btn').forEach(btn => {
      const lane = parseInt(btn.dataset.lane);
      const key = editorSettings.keybinds[lane];
      let keyName = key.replace('Key', '');
      if (key === 'KeyS') keyName = 'S';
      if (key === 'KeyD') keyName = 'D';
      if (key === 'KeyJ') keyName = 'J';
      if (key === 'KeyK') keyName = 'K';
      btn.textContent = `Lane ${lane + 1} (${keyName})`;
    });
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById(`hotkeyLane${i}`);
      if (el) { const key = editorSettings.keybinds[i]; let keyName = key.replace('Key', ''); if (key === 'KeyS') keyName = 'S'; if (key === 'KeyD') keyName = 'D'; if (key === 'KeyJ') keyName = 'J'; if (key === 'KeyK') keyName = 'K'; el.textContent = keyName; }
    }
    const speedSlider = document.getElementById('noteSpeed');
    if (speedSlider) { speedSlider.value = editorSettings.noteSpeed; document.getElementById('speedValue').textContent = `${editorSettings.noteSpeed}px/s`; }
    const scrollSelect = document.getElementById('scrollDir');
    if (scrollSelect) { scrollSelect.value = editorSettings.scrollDirection; }
    const wheelSelect = document.getElementById('wheelDir');
    if (wheelSelect) { wheelSelect.value = editorSettings.wheelDirection; }
    const offsetSlider = document.getElementById('audioOffset');
    if (offsetSlider) { offsetSlider.value = editorSettings.audioOffset; document.getElementById('offsetValue').textContent = `${editorSettings.audioOffset}ms`; }
    const hitlineSlider = document.getElementById('hitlinePos');
    if (hitlineSlider) { hitlineSlider.value = editorSettings.hitlinePos; }
    applySettings();
  }

  function applySettings(){
    LANE_CODES = editorSettings.keybinds;
    SCROLL_SPEED_PX_PER_SEC = editorSettings.noteSpeed;
    SCROLL_DIRECTION = editorSettings.scrollDirection === 'up' ? -1 : 1;
    HITLINE_Y_FRAC = editorSettings.scrollDirection === 'up' ? 1 - editorSettings.hitlinePos : editorSettings.hitlinePos;
    canvas.focus();
  }

  function markChanges(){ hasChanges = true; clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(autoSaveProject, 2000); }

  function autoSaveProject(){
    if (!hasChanges) return;
    const project = { notes, meta: { title: titleInput.value, artist: artistInput.value, difficulty: difficultyInput.value, bpm: bpmInput.value, leadIn: leadInInput.value }, settings: editorSettings, audioFile: audioFile.files?.[0]?.name };
    localStorage.setItem('terrariff_autosave', JSON.stringify(project));
    hasChanges = false;
    const originalText = audioStatus.innerHTML;
    audioStatus.innerHTML = '💾 Saved';
    setTimeout(() => { audioStatus.innerHTML = originalText; }, 1000);
  }

  function loadAutoSave(){
    try {
      const saved = localStorage.getItem('terrariff_autosave');
      if (saved) {
        const project = JSON.parse(saved);
        if (confirm('Auto-saved project found. Load it?')) {
          notes = project.notes || [];
          if (project.meta) { titleInput.value = project.meta.title || ''; artistInput.value = project.meta.artist || ''; difficultyInput.value = project.meta.difficulty || '3'; bpmInput.value = project.meta.bpm || ''; leadInInput.value = project.meta.leadIn || '1.00'; }
          if (project.settings) { editorSettings = { ...editorSettings, ...project.settings }; updateSettingsUI(); }
          sortNotes();
        }
      }
    } catch (e) { console.warn('Failed to load autosave:', e); }
  }

  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (isTypingNow()) return;
    if (!editorActive) return;
    const code = e.code;
    const ctrl = e.ctrlKey || e.metaKey;
    if (code === "Space"){ e.preventDefault(); togglePlay(); return; }
    if (ctrl && code === "KeyZ"){ e.preventDefault(); undo(); return; }
    if (ctrl && code === "KeyY"){ e.preventDefault(); redo(); return; }
    if (code === "ArrowLeft") { e.preventDefault(); setTrackTime(getTrackTime() - 5); return; }
    if (code === "ArrowRight") { e.preventDefault(); setTrackTime(getTrackTime() + 5); return; }
    const lane = LANE_CODES.indexOf(code);
    if (lane === -1) return;
    e.preventDefault();
    keyDown[lane] = true;
    if (!audioBuffer) return;
    holdStart[lane] = getTrackTime();
  }, true);

  document.addEventListener("keyup", (e) => {
    if (isTypingNow()) return;
    if (!editorActive) return;
    const lane = LANE_CODES.indexOf(e.code);
    if (lane === -1) return;
    e.preventDefault();
    keyDown[lane] = false;
    if (!audioBuffer) return;
    const t0 = holdStart[lane];
    holdStart[lane] = null;
    if (t0 == null) return;
    const t1 = getTrackTime();
    const dur = Math.max(0, t1 - t0);
    if (dur < HOLD_TAP_THRESHOLD) addTap(lane, t0);
    else addHold(lane, t0, t1);
  }, true);

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    if (!audioBuffer) return;
    if (!editorActive) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const pick = pickLaneAndTime(mx, my);
    if (!pick) return;
    if (e.button === 2){ deleteNearestNoteAt(pick.lane, pick.time, DELETE_RADIUS_SEC); sortNotes(); return; }
    if (e.button === 0){ mousePlace.active = true; mousePlace.lane = pick.lane; mousePlace.t0 = pick.time; mousePlace.t1 = pick.time; try { canvas.setPointerCapture(e.pointerId); } catch {} }
  });
  canvas.addEventListener("pointermove", (e) => { if (!mousePlace.active) return; const rect = canvas.getBoundingClientRect(); const mx = e.clientX - rect.left; const my = e.clientY - rect.top; const pick = pickLaneAndTime(mx, my); if (!pick) return; mousePlace.t1 = pick.time; });
  canvas.addEventListener("pointerup", (e) => { if (!mousePlace.active) return; if (e.button !== 0) return; const lane = mousePlace.lane; const t0 = mousePlace.t0; const t1 = mousePlace.t1; mousePlace.active = false; mousePlace.lane = -1; const dur = Math.abs(t1 - t0); if (dur < HOLD_TAP_THRESHOLD) addTap(lane, t0); else addHold(lane, t0, t1); });
  canvas.addEventListener("pointercancel", () => { mousePlace.active = false; mousePlace.lane = -1; });
  canvas.addEventListener("wheel", (e) => { if (!audioBuffer) return; if (!editorActive) return; e.preventDefault(); const t = getTrackTime(); const sens = 1.15; let delta = e.deltaY; if (editorSettings.wheelDirection === 'inverted') { delta = -delta; } const dt = (delta / SCROLL_SPEED_PX_PER_SEC) * sens; let next = t + dt; if (getSnapStep() > 0){ next = snapTime(next); } setTrackTime(next); }, { passive: false });
  canvas.addEventListener('dragover', (e) => { e.preventDefault(); canvas.style.outline = '2px solid var(--accent)'; });
  canvas.addEventListener('dragleave', () => { canvas.style.outline = ''; });
  canvas.addEventListener('drop', async (e) => { e.preventDefault(); canvas.style.outline = ''; const file = e.dataTransfer.files[0]; if (file && (file.type.includes('audio') || file.name.match(/\.(mp3|ogg|flac|wav|m4a|aac|wma)$/i))) { const dt = new DataTransfer(); dt.items.add(file); audioFile.files = dt.files; audioFile.dispatchEvent(new Event('change')); } });

  audioFile.addEventListener("change", async () => { const file = audioFile.files && audioFile.files[0]; if (!file) return; try{ await loadAudio(file); }catch(err){ console.error(err); alert("Couldn't decode audio. Try another file format."); } });
  playBtn.addEventListener("click", togglePlay);
  stopBtn.addEventListener("click", () => { stopPlayback(false); setTrackTime(0); });
  playSpeed.addEventListener("change", () => { if (isPlaying) { stopPlayback(true); startPlayback(); } });
  exportBtn.addEventListener("click", exportSongJson);
  clearBtn.addEventListener("click", () => { if (!confirm("Clear all notes?")) return; pushUndo(); notes = []; updateStatsUI(); });
  quantizeBtn.addEventListener("click", () => { const step = getSnapStep(); if (step <= 0) { alert('Set BPM and snap first!'); return; } pushUndo(); notes = notes.map(n => ({ ...n, time: snapTime(n.time) })); sortNotes(); });
  scrub.addEventListener("input", () => { const t = parseFloat(scrub.value) || 0; setTrackTime(t); });
  importBtn.addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", async () => { const f = importFile.files && importFile.files[0]; if (!f) return; const text = await f.text(); importSongJsonText(text); importFile.value = ""; });

  settingsBtn.addEventListener("click", () => { settingsModal.classList.add("active"); updateSettingsUI(); });
  closeSettingsBtn.addEventListener("click", () => { settingsModal.classList.remove("active"); });
  settingsModal.addEventListener("click", (e) => { if (e.target === settingsModal) { settingsModal.classList.remove("active"); } });

  document.querySelectorAll('.keybind-btn').forEach(btn => { btn.addEventListener('click', (e) => { const lane = parseInt(e.target.dataset.lane); if (listeningForLane === lane) { listeningForLane = -1; e.target.style.background = ''; return; } document.querySelectorAll('.keybind-btn').forEach(b => { b.style.background = ''; }); listeningForLane = lane; e.target.style.background = 'rgba(255,107,107,0.3)'; e.target.textContent = 'Press any key...'; }); });
  document.addEventListener('keydown', (e) => { if (listeningForLane !== -1) { e.preventDefault(); const keyCode = e.code; if (keyCode.startsWith('Key') || keyCode === 'Space' || keyCode.startsWith('Digit')) { editorSettings.keybinds[listeningForLane] = keyCode; updateSettingsUI(); saveSettings(); listeningForLane = -1; document.querySelectorAll('.keybind-btn').forEach(b => { b.style.background = ''; }); } } });
  document.getElementById('noteSpeed')?.addEventListener('input', (e) => { editorSettings.noteSpeed = parseInt(e.target.value); document.getElementById('speedValue').textContent = `${editorSettings.noteSpeed}px/s`; saveSettings(); });
  document.getElementById('scrollDir')?.addEventListener('change', (e) => { editorSettings.scrollDirection = e.target.value; saveSettings(); });
  document.getElementById('wheelDir')?.addEventListener('change', (e) => { editorSettings.wheelDirection = e.target.value; saveSettings(); });
  document.getElementById('audioOffset')?.addEventListener('input', (e) => { editorSettings.audioOffset = parseInt(e.target.value); document.getElementById('offsetValue').textContent = `${editorSettings.audioOffset}ms`; saveSettings(); });
  document.getElementById('hitlinePos')?.addEventListener('input', (e) => { editorSettings.hitlinePos = parseFloat(e.target.value); HITLINE_Y_FRAC = editorSettings.scrollDirection === 'up' ? 1 - editorSettings.hitlinePos : editorSettings.hitlinePos; saveSettings(); });
  document.getElementById('resetSettingsBtn')?.addEventListener('click', () => { editorSettings = { keybinds: ['KeyS', 'KeyD', 'KeyJ', 'KeyK'], noteSpeed: 520, scrollDirection: 'down', wheelDirection: 'normal', hitlinePos: 0.78, audioOffset: 0 }; updateSettingsUI(); saveSettings(); });
  document.getElementById('exportSettingsBtn')?.addEventListener('click', () => { const blob = new Blob([JSON.stringify(editorSettings, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'terrariff_editor_settings.json'; a.click(); URL.revokeObjectURL(a.href); });
  document.getElementById('importSettingsBtn')?.addEventListener('click', () => { const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json'; input.onchange = async (e) => { const file = e.target.files[0]; if (!file) return; const text = await file.text(); try { const imported = JSON.parse(text); editorSettings = { ...editorSettings, ...imported }; updateSettingsUI(); saveSettings(); } catch (err) { alert('Invalid settings file!'); } }; input.click(); });

  enableControls(false);
  loadSettings();
  loadAutoSave();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
